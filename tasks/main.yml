---
# Retrieve the current hostname, because {{ ansible_hostname }} still contains the old name
- shell: hostname
  changed_when: false
  register: current_hostname

- name: Install repository prerequisites
  become: yes
  apt:
    pkg: ca-certificates
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure apt keyrings directory exists
  become: yes
  file: path=/etc/apt/keyrings state=directory mode=0755

- name: Add MariaDB repository key
  become: yes
  get_url:
    url: https://mariadb.org/mariadb_release_signing_key.pgp
    dest: /etc/apt/keyrings/mariadb.asc
    mode: '0644'
    force: no

# distro MariaDB ranges from 10.6 (past upstream EOL) to 11.8, the upstream repo gives 11.8 LTS everywhere
- name: Add MariaDB repository
  become: yes
  deb822_repository:
    name: mariadb
    uris: "https://deb.mariadb.org/11.8/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/mariadb.asc
    install_python_debian: yes
  register: mariadb_repo

- name: Update packages database for the MariaDB repository
  become: yes
  apt: update_cache=yes
  when: mariadb_repo is changed

- name: mariadb | Install MariaDB Packages
  become: yes
  apt:
    pkg:
      - mariadb-server
      - python3-pymysql
    state: latest

- name: mariadb | Ensure MariaDB is running
  become: yes
  service: name=mariadb state=started enabled=yes

- name: mariadb | Update root password for all root accounts
  become: yes
  ansible.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    password: "{{ mariadb.root_password }}"
    priv: "{{ omit if item == 'localhost' else '*.*:ALL,GRANT' }}"
    check_implicit_admin: yes
    login_user: root
    login_password: "{{ mariadb.root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  loop:
    - "{{ current_hostname.stdout | lower }}"
    - 127.0.0.1
    - ::1
    - localhost

- name: mariadb | Ensure anonymous users are not in the database
  become: yes
  ansible.mysql.mysql_user:
    name: ''
    host: "{{ item }}"
    state: absent
    login_user: root
    login_password: "{{ mariadb.root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  loop:
    - localhost
    - "{{ current_hostname.stdout | lower }}"

- name: mariadb | Create databases
  become: yes
  ansible.mysql.mysql_db:
    name: "{{ mariadb.database }}"
    state: present
    login_user: root
    login_password: "{{ mariadb.root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: mariadb | Import dump
  become: yes
  ansible.mysql.mysql_db:
    name: "{{ mariadb.database }}"
    state: import
    target: "/vagrant/{{ mariadb.dump }}"
    login_user: root
    login_password: "{{ mariadb.root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  when: mariadb.dump | length > 0

- name: mariadb | Create users
  become: yes
  ansible.mysql.mysql_user:
    name: "{{ mariadb.user }}"
    password: "{{ mariadb.password }}"
    priv: "{{ mariadb.database }}.*:ALL"
    state: present
    login_user: root
    login_password: "{{ mariadb.root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
